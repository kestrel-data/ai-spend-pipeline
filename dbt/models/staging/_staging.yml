version: 2

models:
  - name: stg_azure_openai_usage
    description: Cleaned Azure OpenAI usage, one row per day, API key and deployment.
    columns:
      - name: usage_date
        description: Usage day, US Central.
        tests: [not_null]
      - name: api_key_id
        description: Azure OpenAI API key; owner in stg_api_keys.
        tests: [not_null]
      - name: deployment
        description: Model deployment the key called.
        tests: [not_null]
      - name: input_tokens
        description: Prompt tokens.
      - name: output_tokens
        description: Completion tokens.
      - name: cost_usd
        description: Cost in US dollars as billed. Coalesced from the raw cost_usd or cost column, in case the upstream export renames it again.
        tests: [not_null]
      - name: _load_id
        description: The load that wrote this row.
      - name: _loaded_at
        description: When that load ran, UTC.
  - name: stg_m365_copilot_usage
    description: Cleaned Microsoft 365 Copilot usage, one row per day, user and app.
    columns:
      - name: day
        description: Usage day, US Central.
        tests: [not_null]
      - name: user_id
        description: HR employee id.
        tests: [not_null]
      - name: app
        description: Microsoft 365 app the prompts were made in.
      - name: prompts
        description: Prompts sent that day.
  - name: stg_m365_copilot_seats
    description: Microsoft 365 Copilot seats.
    columns:
      - name: user_id
        description: HR employee id holding the seat.
        tests: [not_null, unique]
      - name: assigned_date
        description: First day the seat is billed.
      - name: removed_date
        description: First day the seat is no longer billed; null while assigned.
      - name: monthly_cost
        description: Seat price per month, US dollars.
  - name: stg_api_keys
    description: Owning department of each Azure OpenAI API key.
    columns:
      - name: api_key_id
        description: Azure OpenAI API key.
        tests: [not_null, unique]
      - name: department
        description: Owning department.
  - name: stg_hr_employees
    description: HR roster without personal data.
    columns:
      - name: employee_id
        description: HR employee id.
        tests: [not_null, unique]
      - name: github_login
        description: GitHub login, where the employee has one.
      - name: department
        description: Department.
      - name: plant
        description: Plant or head office.
  - name: stg_ai_budgets
    description: Monthly AI budget per department.
    columns:
      - name: department
        description: Department.
      - name: month
        description: First day of the month.
      - name: budget
        description: Budget in US dollars.

unit_tests:
  - name: test_stg_azure_openai_usage_cost_column_rename
    model: stg_azure_openai_usage
    description: Guards against Azure OpenAI renaming its cost column again; cost_usd must be backfilled from cost when cost_usd is null.
    given:
      - input: source('raw', 'azure_openai_usage')
        rows:
          - {usage_date: "2026-10-13", api_key_id: "key-1", deployment: "gpt-4o", input_tokens: 1000, output_tokens: 500, cost_usd: null, cost: 12.34, _load_id: 1, _loaded_at: "2026-10-13T06:00:00"}
          - {usage_date: "2026-10-12", api_key_id: "key-1", deployment: "gpt-4o", input_tokens: 900, output_tokens: 400, cost_usd: 10.00, cost: null, _load_id: 1, _loaded_at: "2026-10-12T06:00:00"}
    expect:
      rows:
        - {usage_date: "2026-10-13", api_key_id: "key-1", deployment: "gpt-4o", input_tokens: 1000, output_tokens: 500, cost_usd: 12.34, _load_id: 1, _loaded_at: "2026-10-13T06:00:00"}
        - {usage_date: "2026-10-12", api_key_id: "key-1", deployment: "gpt-4o", input_tokens: 900, output_tokens: 400, cost_usd: 10.00, _load_id: 1, _loaded_at: "2026-10-12T06:00:00"}
